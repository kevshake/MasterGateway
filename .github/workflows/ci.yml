name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GATEWAY_ADMIN_PASSWORD: IntegrationTest-Admin-Pass-32chars!
      H2_DATASOURCE_PASSWORD: IntegrationTest-H2-Pass-32chars!!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and integration tests
        run: ./mvnw -B test
      - name: OWASP dependency-check (fail on CVSS >= 7)
        run: ./mvnw -B org.owasp:dependency-check-maven:check
