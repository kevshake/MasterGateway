
iso8583:
  packager: org.jpos.iso.packager.GenericPackager
  fields:
    0: LLVAR
    1: LLVAR
    2: N
    3: ANS
    4: BINARY
  pos:
    port: 8000
    channel-type: NACC
    packager: org.jpos.iso.packager.ISO87APackager
    netty-server-enabled: true
  bank:
    host: ${ISO8583_BANK_HOST}
    port: 8001
    channel-type: ASCII
    packager: org.jpos.iso.packager.ISO87BPackager
    timeout: 30000
    max-connections: 5
    retry:
      max-attempts: 3
      delay-ms: 5000
      backoff-multiplier: 2.0
  security:
    gateway-zonal-key: ${GATEWAY_ZONAL_KEY}
    default-terminal-key: ${GATEWAY_DEFAULT_TERMINAL_KEY}
    pin:
      enable-transposition: true
      validate-pin-blocks: true
      log-pin-operations: true
    card:
      enable-validation: true
      reject-invalid-cards: true
      log-validation-results: true
  terminal:
    auto-create: true
    enable-key-change: true
    key-length: 2
    key-expiry-days: 365
    log-key-operations: true

spring:
  application:
    name: ISO8583_MasterServer_Base-1
  datasource:
    url: jdbc:h2:mem:terminaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ${H2_DATASOURCE_PASSWORD}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false
        generate_statistics: false
        hbm2ddl:
          auto: update
        globally_quoted_identifiers: false
        globally_quoted_identifiers_skip_column_definitions: true
  security:
    user:
      name: gateway-admin
      password: ${GATEWAY_ADMIN_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    write:
      write-bigdecimal-as-plain: true

server:
  port: 8080

gateway:
  http:
    connect-timeout-ms: 5000
    read-timeout-ms: 30000

# Optional: path for install-generated secrets (see docs/GATEWAY_CONFIGURATION.md).
# Env: GATEWAY_GENERATED_DEFAULTS_FILE

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
