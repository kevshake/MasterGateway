# Local developer profile — enable H2 console; set secrets via env or install generated defaults file.
iso8583:
  bank:
    host: ${ISO8583_BANK_HOST}
  security:
    gateway-zonal-key: ${GATEWAY_ZONAL_KEY}
    default-terminal-key: ${GATEWAY_DEFAULT_TERMINAL_KEY}

spring:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
        trace: false
